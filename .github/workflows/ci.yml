name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Lint + env tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint (bugs only)
        run: uv run ruff check --select E9,F63,F7,F82 --output-format github .
      - name: Env tests
        run: uv run pytest -q

  train-smoke:
    name: PPO training smoke test (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q -m slow

  policy-contract:
    name: Deployed policy matches prairie-ros-sim
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: humanoid-purdue/prairie-ros-sim
          path: prairie-ros-sim
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q -m contract
        env:
          PRAIRIE_ROS_SIM: ${{ github.workspace }}/prairie-ros-sim
